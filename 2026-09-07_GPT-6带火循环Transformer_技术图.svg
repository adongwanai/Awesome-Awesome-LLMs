<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="60" y="70" font-size="40" font-weight="700" fill="#111111">三种「加深度」的方式，差别在这</text>
  <text x="60" y="112" font-size="22" fill="#888888">同一套参数，怎么算得更深</text>

  <!-- ============ 面板1：传统 Transformer ============ -->
  <g transform="translate(60,160)">
    <rect x="0" y="0" width="320" height="500" rx="16" fill="#F5F7FB" stroke="#E4E8F0" stroke-width="2"/>
    <text x="160" y="44" font-size="24" font-weight="700" fill="#333" text-anchor="middle">传统 Transformer</text>
    <text x="160" y="72" font-size="18" fill="#0066FF" text-anchor="middle" font-weight="600">往上堆层</text>

    <!-- 堆叠的层 -->
    <g transform="translate(160,120)">
      <rect x="-70" y="0" width="140" height="40" rx="8" fill="#0066FF"/>
      <rect x="-70" y="52" width="140" height="40" rx="8" fill="#0066FF"/>
      <rect x="-70" y="104" width="140" height="40" rx="8" fill="#0066FF"/>
      <rect x="-70" y="156" width="140" height="40" rx="8" fill="#0066FF"/>
      <rect x="-70" y="208" width="140" height="40" rx="8" fill="#0066FF"/>
      <text x="0" y="26" font-size="20" fill="#fff" text-anchor="middle" font-weight="600">第 12 层</text>
      <text x="0" y="78" font-size="20" fill="#fff" text-anchor="middle" font-weight="600">第 11 层</text>
      <text x="0" y="130" font-size="20" fill="#fff" text-anchor="middle" font-weight="600">…</text>
      <text x="0" y="182" font-size="20" fill="#fff" text-anchor="middle" font-weight="600">第 2 层</text>
      <text x="0" y="234" font-size="20" fill="#fff" text-anchor="middle" font-weight="600">第 1 层</text>
    </g>

    <text x="160" y="440" font-size="18" fill="#666" text-anchor="middle">参数跟着层数一起涨</text>
    <text x="160" y="468" font-size="18" fill="#666" text-anchor="middle">越大越贵</text>
  </g>

  <!-- ============ 面板2：整段循环 ============ -->
  <g transform="translate(440,160)">
    <rect x="0" y="0" width="320" height="500" rx="16" fill="#F5F7FB" stroke="#E4E8F0" stroke-width="2"/>
    <text x="160" y="44" font-size="24" font-weight="700" fill="#333" text-anchor="middle">循环 Transformer（整段）</text>
    <text x="160" y="72" font-size="18" fill="#0066FF" text-anchor="middle" font-weight="600">整段反复跑</text>

    <!-- 一个块 + 循环箭头 -->
    <g transform="translate(160,150)">
      <rect x="-80" y="0" width="160" height="120" rx="12" fill="#0066FF"/>
      <text x="0" y="54" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">同一组层</text>
      <text x="0" y="86" font-size="22" fill="#fff" text-anchor="middle" font-weight="600">跑 3 遍</text>

      <!-- 循环箭头 -->
      <path d="M 80 60 C 140 60, 150 20, 150 -30 C 150 -80, 90 -80, 30 -80 C -30 -80, -60 -60, -60 -30" fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round"/>
      <polygon points="-60,-18 -48,-42 -72,-38" fill="#FF6B00"/>
    </g>

    <text x="160" y="400" font-size="18" fill="#666" text-anchor="middle">所有 token 一起绕</text>
    <text x="160" y="428" font-size="18" fill="#666" text-anchor="middle">简单词也跟着多算</text>
  </g>

  <!-- ============ 面板3：ITT ============ -->
  <g transform="translate(820,160)">
    <rect x="0" y="0" width="320" height="500" rx="16" fill="#FFF4EC" stroke="#FFB37D" stroke-width="2"/>
    <text x="160" y="44" font-size="24" font-weight="700" fill="#333" text-anchor="middle">ITT（百度文心）</text>
    <text x="160" y="72" font-size="18" fill="#FF6B00" text-anchor="middle" font-weight="600">只让难 token 多绕</text>

    <!-- 层 + 动态路由 -->
    <g transform="translate(160,120)">
      <rect x="-70" y="0" width="140" height="40" rx="8" fill="#0066FF" opacity="0.55"/>
      <rect x="-70" y="52" width="140" height="40" rx="8" fill="#0066FF" opacity="0.75"/>
      <rect x="-70" y="104" width="140" height="40" rx="8" fill="#0066FF"/>
      <text x="0" y="26" font-size="18" fill="#fff" text-anchor="middle">第 3 层</text>
      <text x="0" y="78" font-size="18" fill="#fff" text-anchor="middle">第 2 层</text>
      <text x="0" y="130" font-size="18" fill="#fff" text-anchor="middle">第 1 层</text>

      <!-- 简单 token 早停 -->
      <path d="M -70 124 L -120 124 L -120 240" fill="none" stroke="#B0B7C3" stroke-width="4" stroke-dasharray="6 6"/>
      <text x="-128" y="290" font-size="16" fill="#8A919C" font-weight="600">简单词，一层就出</text>

      <!-- 难 token 多绕 -->
      <path d="M 70 124 C 130 124, 130 40, 70 40 C 30 40, 30 124, 0 124 C -20 124, -20 130, 0 130 C 40 130, 40 60, 70 60" fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round"/>
      <text x="132" y="120" font-size="16" fill="#FF6B00" font-weight="600">难词，多绕几圈</text>
    </g>

    <text x="160" y="420" font-size="18" fill="#666" text-anchor="middle">算力按需分配</text>
    <text x="160" y="448" font-size="18" fill="#666" text-anchor="middle">残差连接攒下每轮思考</text>
  </g>

  <!-- 底部标注 -->
  <text x="60" y="720" font-size="18" fill="#B0B7C3">配图二创 · 科技蓝 #0066FF + 活力橙 #FF6B00</text>
</svg>
